name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same PR; never cancel main pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + integration)
        run: bun run test

      - name: Build
        run: bun run build

      - name: i18n sync
        run: bun run check:i18n

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: access:ci-${{ github.sha }}

  e2e:
    name: e2e (dex + api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ github.run_id }}
          path: tests/e2e/.cache/reports/
          if-no-files-found: ignore
          retention-days: 14
